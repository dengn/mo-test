service-type = "LOG"
data-dir = "/workspace/mo-gis-app-projects/data"

[log]
level = "warn"

[observability]
disable-metric = true
disable-trace = true
status-port = 7013

[logservice]
uuid = "eeee1111-1111-4111-8111-111111111111"
deployment-id = 20261013
raft-port = 33020
logservice-port = 33021
gossip-port = 33022
gossip-seed-addresses = ["127.0.0.1:33022"]

[logservice.BootstrapConfig]
bootstrap-cluster = true
num-of-log-shards = 1
num-of-tn-shards = 1
num-of-log-shard-replicas = 1
init-hakeeper-members = ["131072:eeee1111-1111-4111-8111-111111111111"]

[[fileservice]]
name = "LOCAL"
backend = "DISK-V2"
data-dir = "/workspace/mo-gis-app-projects/data/local2"

[[fileservice]]
name = "SHARED"
backend = "DISK-V2"
data-dir = "/workspace/mo-gis-app-projects/data/shared2"

[hakeeper-client]
service-addresses = ["127.0.0.1:33021"]
