service-type = "LOG"
data-dir = "/workspace/mo-gis-main-recheck/data"

[log]
level = "warn"

[observability]
disable-metric = true
disable-trace = true
status-port = 7012

[logservice]
uuid = "dddd1111-1111-4111-8111-111111111111"
deployment-id = 20261013
raft-port = 33010
logservice-port = 33011
gossip-port = 33012
gossip-seed-addresses = ["127.0.0.1:33012"]

[logservice.BootstrapConfig]
bootstrap-cluster = true
num-of-log-shards = 1
num-of-tn-shards = 1
num-of-log-shard-replicas = 1
init-hakeeper-members = ["131072:dddd1111-1111-4111-8111-111111111111"]

[[fileservice]]
name = "LOCAL"
backend = "DISK-V2"
data-dir = "/workspace/mo-gis-main-recheck/data/local2"

[[fileservice]]
name = "SHARED"
backend = "DISK-V2"
data-dir = "/workspace/mo-gis-main-recheck/data/shared2"

[hakeeper-client]
service-addresses = ["127.0.0.1:33011"]
